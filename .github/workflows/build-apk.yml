name: Build UCash APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: apps/mobile_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ucash-apk
          path: apps/mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
